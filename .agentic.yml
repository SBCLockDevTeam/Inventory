general:
  read_first: "EVERY interaction must read this file completely before proceeding"
  root_path: https://SBCQR.com/qr/
  server_path: /var/www/html/sbcqr/qr/
  reference_repo: SBCLockDevTeam/SBCQR (read-only)
  working_repo: https://github.com/SBCLockDevTeam/Inventory (main branch only)

database:
  db_name: SBCInv
  db_user: SBCInv
  db_engine: MariaDB
  db_charset: utf8mb4
  db_password: /config/secrets.php (never commit to Git)

git_workflow:
  authentication: "SSH /root/.ssh/github_push - PERSISTENT, NO TOKENS NEEDED"
  rule_ai_first: AI writes to Git first
  rule_user_pulls: User pulls to server after
  rule_main_only: main branch only, no PRs
  rule_single_instruction: one instruction at a time
  rule_explicit_paths: use full command paths

code_standards:
  dry: Reusable functions in /lib/
  separation: CSS in /css/, JS in /js/, PHP in /lib/, HTML in /templates/
  database: All queries prepared statements, helpers in /lib/database.php
  comments: Explain why, not what
  config: Settings in /config/, secrets never in Git
  no_inline_code: true

safety:
  path_jail: /var/www/html/sbcqr/qr/ (never above this)
  no_circular_refs: Items cannot be own parent (except admin root items)
  prepared_statements: Mandatory for all DB queries

exceptions_policy:
  allowed_for: "Production outages or tool limitations only"
  permission_required: true
  document: "Rule violated, why, scope, return-to-workflow, commit to CHANGELOG.md"