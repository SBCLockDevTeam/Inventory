; PHP per-directory settings for PHP-FPM.
; Apache's .htaccess php_value directives are ignored by PHP-FPM; this file
; is the PHP-FPM equivalent and is read automatically by PHP-FPM from the
; directory where scripts run (user_ini.filename = .user.ini by default).
;
; Photos: up to 10 MB   (api/upload_photo.php)
; Documents: up to 50 MB (api/upload_document.php)
; post_max_size must exceed upload_max_filesize to include form fields.
upload_max_filesize = 50M
post_max_size       = 55M
