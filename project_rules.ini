[general]
root_path = https://SBCQR.com/qr/
apache_document_root = Apache points to /var/www/html/sbcqr/; /qr/ is subdirectory
server_root_distinct = Server root is https://SBCQR.com/, project root is distinct at /qr/
all_references = All references to this server shall be https://SBCQR.com/qr/
config_location = Config file stored in /var/www/html/sbcqr/qr/config/
db_credentials_location = DB credentials and other settings stored in same config file
config_format = Human readable, not code, name value pairs
git_certificate = Git certificate installed on server, Git and agents can write to server directly
workflow_ai_to_git = AI writes to Git repo first
workflow_user_pull = User pulls Git to server after AI updates
not_job_application = Not applying for a job as AI service
user_experience = User is inexperienced, needs explicit and verbose instructions
instruction_order = AI shall not tell user to do something out of order; write to Git before asking to pull
ajax_json_usage = Use AJAX and JSON or similar functions
ftp_access_if_needed = If AI agent unable to perform task, user can give FTP access directly to server path
adjust_rules_as_we_go = Rules will be adjusted as we go along
work_on_main_branch = Work only on the main branch to avoid confusion
server_clone_path = Clone repo to /var/www/html/sbcqr/qr/ on server
command_paths = When giving commands to run, give the entire path rather than relative path
one_instruction = Give one instruction at a time; review outside code boxes; code boxes are for running commands
htaccess_if_needed = Advise on .htaccess updates if needed
one_thing_at_time = Give one thing at a time; no multiple allows; no questions after allow
path_jail = App shall never write above /var/www/html/sbcqr/qr/
reference_repo = AI may read SBCLockDevTeam/SBCQR (https://github.com/SBCLockDevTeam/SBCQR) for reference only; AI shall never edit that repo
working_repo = https://github.com/SBCLockDevTeam/Inventory/tree/main
code_review_workflow = All file updates must be reviewed by user before committing; AI shows complete file content in code block; user reviews and explicitly approves before commit
avoid_pr = AI shall avoid using pull requests; write directly to main branch

[items]
mandatory_fields = Every item has 4 mandatory fields: Item ID (10 hex digits), Item Name, Item Description, Item Primary Image (field exists in DB but user may leave photo blank)
item_cloning = No templates; instead any existing item can be used as a blueprint via a button "Create new item using this items format but not this items data"
dynamic_fields = Admin user can add dynamic fields to an item; field types are: text, textarea, number, date, checkbox, photo, document, signature
photo_field = Photo field allows single or multiple uploads; admin specifies at field definition time whether multiple uploads are allowed
document_field = Document upload field; any file type allowed; if file format is recognised it will be made clickable to pop up/display
signature_field = Signature field opens a popup box for user to sign using finger or mouse; admin defines instructions text shown in popup; stores signature as image; optionally requires printed name; admin sets printed name required toggle at field definition time

[layout]
page_sections = Every page must have the following sections in order: Header, Menu, Error Division (hidden when no error), Title, Body, Footer
branding = Each page displays branding based on selected brand; branding is currently a text name/chunk of text; later will be a full HTML template
brand_selector = A dropdown in the top right of every page allows user to select a brand; this is a placeholder for future user login and authentication
no_auth_yet = No user authentication implemented yet; brand selector drives session branding only
consistent_layout = Page layout and organisation must be consistent across all pages
content_data_driven = Content and menu items may be data driven based on user type and brand in future

[code_organization]
dry_principle = Do not repeat yourself; reusable functions and components used across multiple pages must be extracted to shared library files
separation_of_concerns = CSS, HTML (templates), PHP, and JavaScript must be in separate files; no inline styles or scripts except where absolutely necessary
directory_structure = Root level has: /css/ for stylesheets, /js/ for JavaScript, /templates/ for HTML fragments, /lib/ for PHP utility functions, /assets/ for images and media
naming_conventions = File names are descriptive and lowercase with underscores (e.g., photo_upload_widget.js, form_helpers.php); variable and function names follow language conventions
reusable_components = Common functionality (photo upload, form validation, error handling) must be in shared library files with clear interfaces; pages include these libraries and call functions rather than duplicating code
page_structure = Each page includes: header template, menu template, error division, title, main body content, footer template; use PHP includes or template engine to avoid duplication

[photo_capture]
workflow_simplified = Photo upload workflow must be streamlined; user clicks upload button once, presented with single choice dialog
choice_dialog = Dialog presents two options: "Take Photo with Camera" or "Browse for Image File"; both options from single interaction point
no_confirmation_on
